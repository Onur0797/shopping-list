<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liste de courses</title>

<!-- PWA / iPhone "add to home screen" -->
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Courses" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#1F2E23" />

<style>
  :root{
    --bg: #F1F4EC;
    --panel: #FFFFFF;
    --ink: #1F2E23;
    --ink-soft: #52604F;
    --line: #DCE3D3;
    --mustard: #D9A441;
    --mustard-deep: #B8842B;
    --rust: #B5533C;
    --sage-tag: #E4EBDA;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header.top{
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    padding: calc(14px + env(safe-area-inset-top)) 16px 0;
    border-bottom: 2px solid var(--ink);
  }
  header.top h1{
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  nav.tabs{
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 10px;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar{ display: none; }
  nav.tabs button{
    flex-shrink: 0;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  nav.tabs button.active{
    background: var(--ink);
    color: #FFFDF8;
    border-color: var(--ink);
  }

  main{ padding: 16px; max-width: 620px; margin: 0 auto; }

  .empty{
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 36px 20px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }

  ul.list{ list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }

  li.item{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--mustard);
    border-radius: 8px;
    padding: 11px 13px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  li.item .info{ min-width: 0; }
  li.item .nom{ font-size: 15px; font-weight: 600; word-break: break-word; }
  li.item .qte{
    display: inline-block;
    background: var(--sage-tag);
    border-radius: 5px;
    padding: 1px 7px;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink);
    margin-top: 3px;
  }
  li.item .remarque{ font-size: 12px; color: var(--ink-soft); margin-top: 3px; font-style: italic; }

  li.item.deleting{
    background: #FBEDE9;
    border-color: var(--rust);
  }

  .item-actions{ display: flex; gap: 6px; flex-shrink: 0; }

  button.del, button.edit{
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 30px; height: 30px;
    font-size: 15px;
    cursor: pointer;
  }
  button.del{ color: var(--rust); }
  button.del.flash{ background: var(--rust); color: #fff; border-color: var(--rust); }
  button.edit{ color: var(--ink-soft); }
  button.edit:hover{ border-color: var(--mustard-deep); color: var(--ink); }

  .edit-form{ display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .edit-form input{
    font-family: inherit;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 9px;
    background: var(--panel);
    color: var(--ink);
    width: 100%;
  }
  .edit-form input:focus{ outline: none; border-color: var(--mustard-deep); }
  .edit-form .edit-row{ display: flex; gap: 6px; }
  .edit-form .edit-actions{ display: flex; gap: 8px; margin-top: 2px; }
  .edit-form button{
    font-family: inherit;
    font-weight: 600;
    font-size: 12.5px;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .edit-form button.save{ background: var(--ink); color: #FFFDF8; border-color: var(--ink); }
  .edit-form button.cancel{ background: var(--panel); color: var(--ink-soft); }

  form.add-form{
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 620px;
    margin: 0 auto;
  }
  form.add-form .row{ display: flex; gap: 8px; }
  form.add-form input{
    font-family: inherit;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--panel);
    color: var(--ink);
    width: 100%;
  }
  form.add-form input:focus{ outline: none; border-color: var(--mustard-deep); }
  .f-nom{ flex: 1.6; }
  .f-qte{ flex: 0 1 96px; min-width: 84px; }
  form.add-form input.f-remarque{ flex: 1.2 1 100px; min-width: 90px; font-size: 16px; }

  button.add-btn{
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    background: var(--ink);
    color: #FFFDF8;
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
  }
  button.add-btn:disabled{ background: #A9B3A3; }

  .status{ font-size: 12px; text-align: center; padding: 8px 0; color: var(--ink-soft); }
  .status.err{ color: var(--rust); }

  .top-row{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header.top h1{ margin: 0; }
  button.card-btn{
    flex-shrink: 0;
    font-size: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 40px; height: 40px;
    cursor: pointer;
    line-height: 1;
  }

  .card-overlay{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    overflow-y: auto;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .card-overlay-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .card-overlay-title{ font-size: 19px; font-weight: 700; }
  button.card-close{
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 34px; height: 34px;
    font-size: 18px;
    cursor: pointer;
    color: var(--ink-soft);
  }

  .card-image-wrap{ display: flex; justify-content: center; margin-bottom: 16px; }
  .card-image-wrap img{
    max-width: 100%;
    max-height: 340px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .card-actions{ display: flex; gap: 10px; }
  .card-actions button{
    flex: 1;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    padding: 11px;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .card-actions .replace-btn{ background: var(--panel); color: var(--ink); }
  .card-actions .delete-btn{ background: var(--panel); color: var(--rust); border-color: var(--rust); }

  .card-choose-btn{
    display: block;
    width: 100%;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    background: var(--ink);
    color: #FFFDF8;
    border: none;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    text-align: center;
  }
  .card-choose-btn:disabled{ background: #A9B3A3; }

  .custom-list{ list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .custom-list li{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .custom-list li img{ width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .custom-list li .name{ font-size: 15px; font-weight: 600; flex: 1; }
  .custom-list li .chevron{ color: var(--ink-soft); font-size: 14px; }

  .add-custom-form{ display: flex; gap: 8px; margin-bottom: 16px; }
  .add-custom-form input{
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .add-custom-form button{
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    background: var(--ink);
    color: #FFFDF8;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    cursor: pointer;
  }

  .card-back-btn{
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 0 0 14px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1>Liste de courses</h1>
    <button class="card-btn" id="openCardBtn" title="Carte de fidélité">🎫</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div id="listContainer"></div>
  <div id="statusBox"></div>
</main>

<form class="add-form" id="addForm">
  <div class="row">
    <input class="f-nom" id="inputNom" type="text" placeholder="Ajouter un ingrédient" required />
  </div>
  <div class="row">
    <input class="f-qte" id="inputQte" type="text" placeholder="Quantité" />
    <input class="f-remarque" id="inputRemarque" type="text" placeholder="Remarque" />
    <button class="add-btn" type="submit" id="submitBtn">Ajouter</button>
  </div>
</form>

<!-- Écran séparé pour les cartes de fidélité, ne se superpose jamais à la liste de courses -->
<div class="card-overlay" id="cardOverlay" style="display:none;">
  <div class="card-overlay-header">
    <div class="card-overlay-title" id="cardOverlayTitle"></div>
    <button class="card-close" id="closeCardBtn">×</button>
  </div>
  <div id="cardOverlayBody"></div>
</div>

<input type="file" accept="image/*" id="cardFileInput" style="display:none;" />

<!-- Rendu instantané des onglets et de la liste, sans attendre le réseau -->
<script>
  window.__app = {
    STORES: ["Delhaize", "Carrefour", "Lidl", "Action", "Albert Heijn", "Amazon", "Ikea", "Autre"],
    activeStore: null,
    allItems: [],
    ready: false,
    editingId: null,
    loyaltyCards: {},
    loyaltyReady: false,
    customCards: [],
    customReady: false,
    viewingCustomId: null,
    addingCustomCard: false,
    fileInputContext: null,
  };
  window.__app.activeStore = window.__app.STORES[0];

  const tabsEl = document.getElementById("tabs");
  const listEl = document.getElementById("listContainer");
  const statusEl = document.getElementById("statusBox");
  const form = document.getElementById("addForm");
  const inputNom = document.getElementById("inputNom");
  const inputQte = document.getElementById("inputQte");
  const inputRemarque = document.getElementById("inputRemarque");
  const submitBtn = document.getElementById("submitBtn");
  const openCardBtn = document.getElementById("openCardBtn");
  const closeCardBtn = document.getElementById("closeCardBtn");
  const cardOverlay = document.getElementById("cardOverlay");
  const cardOverlayTitle = document.getElementById("cardOverlayTitle");
  const cardOverlayBody = document.getElementById("cardOverlayBody");
  const cardFileInput = document.getElementById("cardFileInput");

  function renderTabs(){
    const { STORES, activeStore, allItems, ready } = window.__app;
    tabsEl.innerHTML = "";
    STORES.forEach(store => {
      const btn = document.createElement("button");
      const count = ready ? allItems.filter(it => it.store === store).length : 0;
      btn.textContent = count > 0 ? `${store} (${count})` : store;
      if (store === activeStore) btn.classList.add("active");
      btn.onclick = () => { window.__app.activeStore = store; renderTabs(); renderList(); };
      tabsEl.appendChild(btn);
    });
  }

  function renderList(){
    const { allItems, activeStore, ready } = window.__app;
    if (!ready){
      listEl.innerHTML = `<div class="empty">Connexion à la liste en cours…</div>`;
      return;
    }
    const items = allItems.filter(it => it.store === activeStore);
    if (items.length === 0){
      listEl.innerHTML = `<div class="empty">Rien à ajouter pour ${activeStore} pour l'instant.</div>`;
      return;
    }
    listEl.innerHTML = "";
    const ul = document.createElement("ul");
    ul.className = "list";
    items.forEach(it => {
      const li = document.createElement("li");
      li.className = "item";

      if (window.__app.editingId === it.id){
        li.innerHTML = `
          <form class="edit-form">
            <input class="e-nom" type="text" placeholder="Nom" required />
            <div class="edit-row">
              <input class="e-qte" type="text" placeholder="Quantité" style="flex:0 1 96px;" />
              <input class="e-remarque" type="text" placeholder="Remarque" style="flex:1.2;" />
            </div>
            <div class="edit-actions">
              <button type="submit" class="save">Enregistrer</button>
              <button type="button" class="cancel">Annuler</button>
            </div>
          </form>
        `;
        const eNom = li.querySelector(".e-nom");
        const eQte = li.querySelector(".e-qte");
        const eRemarque = li.querySelector(".e-remarque");
        eNom.value = it.nom;
        eQte.value = it.qte || "";
        eRemarque.value = it.remarque || "";
        li.querySelector(".cancel").onclick = () => { window.__app.editingId = null; renderList(); };
        li.querySelector(".edit-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const nom = eNom.value.trim();
          if (!nom) return;
          try {
            await window.__app.updateItem(it.id, { nom, qte: eQte.value.trim(), remarque: eRemarque.value.trim() });
            window.__app.editingId = null;
          } catch (err) {
            setStatus("Erreur de modification, réessaie.", true);
            console.error(err);
          }
        });
        ul.appendChild(li);
        return;
      }

      li.innerHTML = `
        <div class="info">
          <div class="nom"></div>
          ${it.qte ? `<div class="qte"></div>` : ""}
          ${it.remarque ? `<div class="remarque"></div>` : ""}
        </div>
        <div class="item-actions">
          <button class="edit" title="Modifier">✎</button>
          <button class="del" title="Supprimer">×</button>
        </div>
      `;
      li.querySelector(".nom").textContent = it.nom;
      if (it.qte) li.querySelector(".qte").textContent = it.qte;
      if (it.remarque) li.querySelector(".remarque").textContent = it.remarque;
      li.querySelector(".edit").onclick = () => { window.__app.editingId = it.id; renderList(); };
      const delBtn = li.querySelector(".del");
      delBtn.onclick = () => {
        delBtn.classList.add("flash");
        li.classList.add("deleting");
        delBtn.disabled = true;
        setTimeout(() => {
          window.__app.deleteItem && window.__app.deleteItem(it.id);
        }, 200);
      };
      ul.appendChild(li);
    });
    listEl.appendChild(ul);
  }

  function setStatus(msg, isErr){
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (isErr ? " err" : "");
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim){ width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        // On réduit encore la qualité si besoin pour rester bien sous la limite de 1 Mo par fiche Firestore
        let q = quality;
        let dataUrl = canvas.toDataURL("image/jpeg", q);
        while (dataUrl.length > 700000 && q > 0.35){
          q -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", q);
        }
        if (dataUrl.length > 900000){
          reject(new Error("Photo trop volumineuse même compressée, choisis-en une autre."));
        } else {
          resolve(dataUrl);
        }
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function openCardOverlay(){
    window.__app.viewingCustomId = null;
    window.__app.addingCustomCard = false;
    cardOverlay.style.display = "block";
    renderCardOverlay();
  }
  function closeCardOverlay(){
    cardOverlay.style.display = "none";
  }
  openCardBtn.onclick = openCardOverlay;
  closeCardBtn.onclick = closeCardOverlay;

  function renderCardOverlay(){
    const store = window.__app.activeStore;
    const { loyaltyCards, loyaltyReady, customCards, customReady, viewingCustomId, addingCustomCard } = window.__app;

    if (store !== "Autre"){
      cardOverlayTitle.textContent = `Carte de fidélité — ${store}`;
      if (!loyaltyReady){
        cardOverlayBody.innerHTML = `<p class="status">Chargement…</p>`;
        return;
      }
      const url = loyaltyCards[store];
      if (!url){
        cardOverlayBody.innerHTML = `<button class="card-choose-btn" id="chooseBtn">📷 Choisir une photo</button>`;
        document.getElementById("chooseBtn").onclick = () => {
          window.__app.fileInputContext = { type: "store", store };
          cardFileInput.click();
        };
        return;
      }
      cardOverlayBody.innerHTML = `
        <div class="card-image-wrap"><img src="${url}" alt="Carte ${store}" /></div>
        <div class="card-actions">
          <button class="replace-btn" id="replaceBtn">Remplacer</button>
          <button class="delete-btn" id="deleteBtn">Supprimer</button>
        </div>
      `;
      document.getElementById("replaceBtn").onclick = () => {
        if (confirm("Remplacer la photo actuelle ? L'ancienne sera définitivement perdue.")){
          window.__app.fileInputContext = { type: "store", store };
          cardFileInput.click();
        }
      };
      document.getElementById("deleteBtn").onclick = async () => {
        if (confirm("Supprimer définitivement cette carte ?")){
          try { await window.__app.deleteLoyaltyCard(store); }
          catch (err) { setStatus("Erreur de suppression, réessaie.", true); console.error(err); }
        }
      };
      return;
    }

    // Onglet "Autre" : liste de cartes diverses nommées
    if (!customReady){
      cardOverlayTitle.textContent = "Cartes diverses";
      cardOverlayBody.innerHTML = `<p class="status">Chargement…</p>`;
      return;
    }

    if (viewingCustomId){
      const c = customCards.find(x => x.id === viewingCustomId);
      if (!c){ window.__app.viewingCustomId = null; return renderCardOverlay(); }
      cardOverlayTitle.textContent = c.name;
      cardOverlayBody.innerHTML = `
        <button class="card-back-btn" id="backBtn">← Retour à la liste</button>
        <div class="card-image-wrap"><img src="${c.imageUrl}" alt="${c.name}" /></div>
        <div class="card-actions">
          <button class="replace-btn" id="replaceBtn">Remplacer</button>
          <button class="delete-btn" id="deleteBtn">Supprimer</button>
        </div>
      `;
      document.getElementById("backBtn").onclick = () => { window.__app.viewingCustomId = null; renderCardOverlay(); };
      document.getElementById("replaceBtn").onclick = () => {
        if (confirm("Remplacer la photo actuelle ? L'ancienne sera définitivement perdue.")){
          window.__app.fileInputContext = { type: "customReplace", id: c.id };
          cardFileInput.click();
        }
      };
      document.getElementById("deleteBtn").onclick = async () => {
        if (confirm(`Supprimer définitivement la carte "${c.name}" ?`)){
          try {
            await window.__app.deleteCustomCard(c.id);
            window.__app.viewingCustomId = null;
          } catch (err) { setStatus("Erreur de suppression, réessaie.", true); console.error(err); }
        }
      };
      return;
    }

    cardOverlayTitle.textContent = "Cartes diverses";

    if (addingCustomCard){
      cardOverlayBody.innerHTML = `
        <button class="card-back-btn" id="backBtn">← Annuler</button>
        <form class="add-custom-form" id="customNameForm">
          <input type="text" id="customNameInput" placeholder="Nom de la carte (ex. Fnac)" required />
          <button type="submit">Suivant</button>
        </form>
      `;
      document.getElementById("backBtn").onclick = () => { window.__app.addingCustomCard = false; renderCardOverlay(); };
      document.getElementById("customNameForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("customNameInput").value.trim();
        if (!name) return;
        window.__app.fileInputContext = { type: "customNew", name };
        cardFileInput.click();
      });
      return;
    }

    let listHtml = "";
    if (customCards.length === 0){
      listHtml = `<p class="empty">Aucune carte ajoutée pour l'instant.</p>`;
    } else {
      listHtml = `<ul class="custom-list">` + customCards.map(c => `
        <li data-id="${c.id}">
          <img src="${c.imageUrl}" alt="${c.name}" />
          <span class="name"></span>
          <span class="chevron">›</span>
        </li>
      `).join("") + `</ul>`;
    }
    cardOverlayBody.innerHTML = listHtml + `<button class="card-choose-btn" id="addCustomBtn">+ Ajouter une carte</button>`;
    cardOverlayBody.querySelectorAll(".custom-list li").forEach(li => {
      const id = li.getAttribute("data-id");
      li.querySelector(".name").textContent = customCards.find(c => c.id === id).name;
      li.onclick = () => { window.__app.viewingCustomId = id; renderCardOverlay(); };
    });
    document.getElementById("addCustomBtn").onclick = () => { window.__app.addingCustomCard = true; renderCardOverlay(); };
  }

  cardFileInput.addEventListener("change", async () => {
    const file = cardFileInput.files[0];
    const ctx = window.__app.fileInputContext;
    cardFileInput.value = "";
    if (!file || !ctx) return;
    cardOverlayBody.innerHTML = `<p class="status">Compression et envoi de la photo…</p>`;
    try {
      const dataUrl = await compressImage(file, 900, 0.6);
      if (ctx.type === "store"){
        await window.__app.saveLoyaltyCard(ctx.store, dataUrl);
      } else if (ctx.type === "customNew"){
        await window.__app.addCustomCard(ctx.name, dataUrl);
        window.__app.addingCustomCard = false;
      } else if (ctx.type === "customReplace"){
        await window.__app.updateCustomCardImage(ctx.id, dataUrl);
      }
    } catch (err) {
      setStatus(err.message && err.message.includes("volumineuse") ? err.message : "Erreur d'envoi de la photo, réessaie.", true);
      console.error(err);
    } finally {
      window.__app.fileInputContext = null;
      renderCardOverlay();
    }
  });


  function refreshSubmitState(){
    submitBtn.disabled = !window.__app.ready || !inputNom.value.trim();
    submitBtn.textContent = window.__app.ready ? "Ajouter" : "Connexion…";
  }
  inputNom.addEventListener("input", refreshSubmitState);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.__app.ready || !window.__app.addItem) {
      setStatus("Toujours en train de se connecter, réessaie dans un instant.", true);
      return;
    }
    const nom = inputNom.value.trim();
    if (!nom) return;
    const qte = inputQte.value.trim();
    const remarque = inputRemarque.value.trim();
    submitBtn.disabled = true;
    try {
      await window.__app.addItem({ store: window.__app.activeStore, nom, qte, remarque });
      inputNom.value = "";
      inputQte.value = "";
      inputRemarque.value = "";
      inputNom.focus();
      setStatus("");
    } catch (err) {
      setStatus("Erreur d'ajout, réessaie.", true);
      console.error(err);
    } finally {
      refreshSubmitState();
    }
  });

  // Exposés pour que le script Firebase (module) puisse déclencher un nouvel affichage
  window.__app.renderList = renderList;
  window.__app.renderTabs = renderTabs;
  window.__app.setStatus = setStatus;
  window.__app.refreshSubmitState = refreshSubmitState;
  window.__app.renderCardOverlay = () => { if (cardOverlay.style.display !== "none") renderCardOverlay(); };

  renderTabs();
  renderList();
  refreshSubmitState();
  setStatus("Connexion à la liste en cours…");
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, updateDoc, setDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmUr3kgh1alYxd-LOAAZlzFdW8is3LTh4",
    authDomain: "j---shopping-list-2c904.firebaseapp.com",
    projectId: "j---shopping-list-2c904",
    storageBucket: "j---shopping-list-2c904.firebasestorage.app",
    messagingSenderId: "872014163579",
    appId: "1:872014163579:web:0be12f52ef4b577ab67cde"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const itemsRef = collection(db, "items");
  const loyaltyCardsRef = collection(db, "loyaltyCards");
  const customCardsRef = collection(db, "customCards");

  onSnapshot(query(itemsRef, orderBy("createdAt", "desc")), (snap) => {
    window.__app.allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    window.__app.ready = true;
    window.__app.renderTabs();
    window.__app.renderList();
    window.__app.refreshSubmitState();
    window.__app.setStatus("");
  }, (err) => {
    window.__app.setStatus("Connexion à la base impossible. Vérifie ta config Firebase.", true);
    console.error(err);
  });

  onSnapshot(loyaltyCardsRef, (snap) => {
    const cards = {};
    snap.docs.forEach(d => { cards[d.id] = d.data().imageUrl; });
    window.__app.loyaltyCards = cards;
    window.__app.loyaltyReady = true;
    window.__app.renderCardOverlay();
  }, (err) => console.error(err));

  onSnapshot(query(customCardsRef, orderBy("createdAt", "asc")), (snap) => {
    window.__app.customCards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    window.__app.customReady = true;
    window.__app.renderCardOverlay();
  }, (err) => console.error(err));

  window.__app.addItem = (item) => addDoc(itemsRef, { ...item, createdAt: serverTimestamp() });
  window.__app.updateItem = (id, data) => updateDoc(doc(db, "items", id), data);
  window.__app.deleteItem = async (id) => {
    try {
      await deleteDoc(doc(db, "items", id));
    } catch (err) {
      window.__app.setStatus("Erreur de suppression, réessaie.", true);
      console.error(err);
    }
  };

  window.__app.saveLoyaltyCard = (store, imageUrl) =>
    setDoc(doc(db, "loyaltyCards", store), { imageUrl, updatedAt: serverTimestamp() });

  window.__app.deleteLoyaltyCard = (store) => deleteDoc(doc(db, "loyaltyCards", store));

  window.__app.addCustomCard = (name, imageUrl) =>
    addDoc(customCardsRef, { name, imageUrl, createdAt: serverTimestamp() });

  window.__app.updateCustomCardImage = (id, imageUrl) =>
    updateDoc(doc(db, "customCards", id), { imageUrl });

  window.__app.deleteCustomCard = (id) => deleteDoc(doc(db, "customCards", id));
</script>
